<!doctype html>
<!-- BANNER: one file → three store assets, each the same art at its own size (`studio final`):
       Google Play feature graphic 1024x500 · App Store product page header 3840x1646 (21:9) · App Store search result 3840x2560 (3:2)
     Two layers:
       .key   the key art, authored at 2160x1030 px: logo, headline, sub, phones. `final` centres this box on every
              canvas with ONE framing: the feature graphic fits it into Play's safe area, and the App Store header
              and search result show the same crop scaled up to their height (side margin capped), so the words sit
              centred top to bottom and the phones run off the bottom edge in all three. Px here are real.
              Every word and the logo stay inside the box. Phones and props may run past its edges (they are art);
              keep them inside .key's composition, not as extra art on the canvas.
       .slide the canvas background (colour, grid, glow, grain). Its shape differs per format (2.05:1, 2.33:1,
              1.5:1), so use % positions and sizes, never fixed canvas coordinates.
     Match the chosen concept: its palette, fonts, headline style and one signature prop (a blurred one behind the
     phones reads best). The overview draws each store's crop-safe area dashed as a reference. Never set a size on
     html/body. -->
<html style="--n:1"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400..800&display=block" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  :root{--base:#33343b;--base2:#24252b;--glow:#6b6d78;--accent:#ffffff;--on-base:#ffffff;--on-accent:#24252b;--ink:#17181c}   /* placeholder: paste the locked set's palette */
  html,body{width:100vw;height:100vh}
  .slide{inset:0;width:auto;height:auto;background:
      radial-gradient(45% 75% at 62% 45%,color-mix(in srgb,var(--glow) 60%,transparent),transparent 70%),
      linear-gradient(170deg,var(--base),var(--base2))}
  .grain{background-size:900px 900px}
  .key{position:absolute;left:0;top:0;width:2160px;height:1030px}
  .logo{position:absolute;left:0;top:40px;height:110px}
  .h{position:absolute;left:-6px;top:220px;font:800 184px/.93 "Bricolage Grotesque";font-variation-settings:"opsz" 96;letter-spacing:-.052em;color:var(--on-base)}
  .mark{display:inline-block;background:var(--accent);color:var(--on-accent);padding:0 .14em .04em;border-radius:.2em;transform:rotate(-2.5deg);margin-left:-.06em}
  .sub{position:absolute;left:0;top:640px;font:500 62px/1.3 Inter;letter-spacing:-.02em;color:color-mix(in srgb,var(--on-base) 85%,transparent)}
  .obj{position:absolute;filter:drop-shadow(0 48px 48px rgba(2,8,48,.42))}
  .obj.bg{filter:blur(7px) drop-shadow(0 30px 30px rgba(2,8,48,.3));opacity:.85}
</style>
<script src="../../screens/screens.js"></script>
</head><body>
<div class="slide" style="left:0">
  <div class="key">
    <!-- one signature prop, blurred, tucked behind the back phone's top corner -->
    <img class="obj bg" src="../../assets/3d/star.png" style="left:1980px;top:-90px;width:300px;transform:rotate(12deg)">
    <img class="logo" src="../../assets/brand/logo.svg" alt="">
    <div class="h">Hero headline,<br>two <span class="mark">lines.</span></div>
    <div class="sub">The same subtitle as screenshot 1.</div>
    <!-- phones ~650-760px wide (their authored size; keep them that big for sharp 3D); data-persp ≈ 4.9 × width;
         data-vc = optical centre x inside .key -->
    <div class="phone" data-src="@1" data-w="640" data-tilt="10,22,-8" data-persp="3130" data-vc="1960" style="left:0;top:20px"></div>
    <div class="phone" data-src="@0" data-w="720" data-tilt="10,-22,8" data-persp="3520" data-vc="1580" style="left:0;top:150px"></div>
  </div>
  <div class="grain"></div>
</div>
<script src="shared.js"></script>
<script>document.fonts.ready.then(() => document.body.dataset.ready = 1)</script>
</body></html>
